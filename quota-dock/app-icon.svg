<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161a" />
      <stop offset="100%" stop-color="#0c0d0f" />
    </linearGradient>
    <linearGradient id="openaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dc7ab" />
      <stop offset="100%" stop-color="#10a37f" />
    </linearGradient>
    <linearGradient id="googleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8dafff" />
      <stop offset="100%" stop-color="#4285f4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#23272f" stroke-width="8" />

  <!-- Outer Ring: OpenAI Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1f232b" stroke-width="28" stroke-linecap="round" />
  <path d="M 256 96 A 160 160 0 0 1 416 256" fill="none" stroke="url(#openaiGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Ring: Google Arc -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#1b1e24" stroke-width="24" stroke-linecap="round" />
  <path d="M 146 256 A 110 110 0 0 1 256 146" fill="none" stroke="url(#googleGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Dock Indicator Dot -->
  <circle cx="256" cy="256" r="28" fill="#f3f4f6" />
  <circle cx="256" cy="256" r="14" fill="#0c0d0f" />
</svg>
