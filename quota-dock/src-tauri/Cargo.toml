[package]
name = "quota-dock"
version = "0.3.0"
description = "Monitor de quotas das contas usadas no OpenCode para Windows"
authors = ["entaocadu"]
license = "MIT"
repository = "https://github.com/entaocadu/quota-dock"
edition = "2021"

[lib]
name = "quota_dock_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.3.1", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
getrandom = "0.3"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
